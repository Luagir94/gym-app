version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gym_postgres
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym_password
      POSTGRES_DB: gym_dev
    ports:
      - '5432:5432'
    volumes:
      - gym_postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gym -d gym_dev']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gym_postgres_data:
